<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - AZ Performance</title>
    <link rel="preload" href="styles.css" as="style">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="/" crossorigin>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <span class="logo-icon">⚙️</span>
                <span class="logo-text">AZ Performance</span>
            </div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/admin" class="active">Admin</a>
                <a href="/admin/leads">Lead Research</a>
            </div>
        </div>
    </nav>

    <main class="main-content" id="main-content">
        <!-- Login Screen -->
        <section id="loginSection" class="admin-section">
            <div class="container">
                <div class="login-card">
                    <h1 class="admin-title">🔐 Admin Login</h1>
                    <p style="color: var(--text-dark); text-align: center; margin-bottom: 2rem;">Enter password to access admin panel</p>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="adminPassword">Password</label>
                            <input type="password" id="adminPassword" name="password" placeholder="Enter admin password" required autofocus>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                        <div id="loginMessage" class="message" style="margin-top: 1rem;"></div>
                    </form>
                </div>
            </div>
        </section>

        <!-- Admin Panel (hidden until logged in) -->
        <section id="adminPanelSection" class="admin-section" style="display: none;">
            <div class="container">
                <div class="admin-header">
                    <h1 class="admin-title">Admin Panel</h1>
                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <button class="btn btn-secondary" id="refreshBtn">🔄 Refresh Orders</button>
                        <button class="btn btn-danger" id="logoutBtn">🚪 Logout</button>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card" tabindex="0" role="button">
                        <div class="stat-value" id="totalOrders">0</div>
                        <div class="stat-label">Total Orders</div>
                    </div>
                    <div class="stat-card" tabindex="0" role="button">
                        <div class="stat-value" id="pendingOrders">0</div>
                        <div class="stat-label">Pending</div>
                    </div>
                    <div class="stat-card" tabindex="0" role="button">
                        <div class="stat-value" id="processingOrders">0</div>
                        <div class="stat-label">Processing</div>
                    </div>
                    <div class="stat-card" tabindex="0" role="button">
                        <div class="stat-value" id="completedOrders">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                </div>

                <div class="orders-container">
                    <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem; flex-wrap: wrap;">
                        <h2 class="section-title" style="margin: 0;">Orders</h2>
                        <label for="searchInput" class="visually-hidden">Search orders</label>
                        <input type="text" id="searchInput" placeholder="🔍 Search by name, email, vehicle..." 
                               style="flex: 1; min-width: 200px; min-height: 44px; padding: 0.75rem 1rem; background: var(--bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--gray-200); font-size: 0.9rem;"
                               oninput="searchOrders(this.value)">
                    </div>
                    <div id="ordersList" class="orders-list">
                        <div class="loading">Loading orders...</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Order Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close modal">&times;</button>
            <h2 id="modalTitle">Order Details</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 AZ Performance. Admin Panel.</p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="admin.js" defer></script>
</body>
</html>
